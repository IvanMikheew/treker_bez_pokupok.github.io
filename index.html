<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Дни без покупок тканей</title>
  <meta name="description" content="Счётчик дней без покупок тканей: календарь отметок, серия подряд и подбадривающие слова.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Без покупок">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-blob bg-blob--1" aria-hidden="true"></div>
  <div class="bg-blob bg-blob--2" aria-hidden="true"></div>

  <main class="app">
    <header class="hero reveal">
      <div class="hero__title">🧶 Дни без покупок тканей</div>

      <div class="counter" aria-live="polite">
        <div class="counter__value" id="streakValue">0</div>
        <div class="counter__label">дней подряд без покупок</div>
      </div>

      <button type="button" class="btn btn--ghost" id="todayBtn">
        <span id="todayBtnIcon">✅</span>
        <span id="todayBtnText">Сегодня не было покупок</span>
      </button>
      <p class="hero__hint" id="todayHint">Отметьте день, если покупки ткани не было.</p>
    </header>

    <section class="stats reveal">
      <div class="stat">
        <div class="stat__value" id="bestValue">0</div>
        <div class="stat__label">лучшая серия</div>
      </div>
      <div class="stat">
        <div class="stat__value" id="totalValue">0</div>
        <div class="stat__label">всего дней</div>
      </div>
      <div class="stat">
        <div class="stat__value" id="monthValue">0</div>
        <div class="stat__label" id="monthLabel">в этом месяце</div>
      </div>
    </section>

    <section class="card reveal">
      <div class="cal__head">
        <button type="button" class="icon-btn" id="prevMonth" aria-label="Предыдущий месяц">‹</button>
        <h2 class="cal__title" id="monthTitle">—</h2>
        <button type="button" class="icon-btn" id="nextMonth" aria-label="Следующий месяц">›</button>
      </div>

      <div class="cal__weekdays" id="weekdays" aria-hidden="true"></div>
      <div class="cal__grid" id="calendarGrid"></div>

      <div class="cal__legend">
        <span class="legend-item"><span class="legend-swatch legend-swatch--done">✓</span> не было покупки</span>
        <span class="legend-item"><span class="legend-swatch legend-swatch--today"></span> сегодня</span>
      </div>
      <p class="cal__summary" id="monthSummary"></p>
    </section>

    <footer class="foot reveal">
      <p>Данные хранятся только на этом устройстве. Работает офлайн.</p>
    </footer>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" id="modalBackdrop"></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalText">
      <div class="modal__emoji" id="modalEmoji">🎉</div>
      <p class="modal__text" id="modalText"></p>
      <div class="modal__chips" id="modalChips"></div>
      <button type="button" class="btn btn--primary" id="modalClose">Продолжаем!</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
